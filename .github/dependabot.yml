version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /bindings/python
    schedule:
      interval: weekly
    groups:
      python-tools:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
