name: Performance evidence

on:
  pull_request:
    paths:
      - "src/**"
      - "benches/**"
      - "tests/fixtures/**"
      - "tests/support/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/compare_*.py"
      - "scripts/common.py"
      - "scripts/rust/contract_probe.rs"
      - ".github/workflows/performance.yml"
  workflow_dispatch:
    inputs:
      base:
        description: Exact baseline commit or tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || inputs.base }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Measure paired release calls
        run: python -m scripts.compare_performance --base ../base --output "$RUNNER_TEMP/performance"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: paired-native-performance
          path: |
            ${{ runner.temp }}/performance/*.json
            ${{ runner.temp }}/performance/*.md
            ${{ runner.temp }}/performance/contracts/*.json
            ${{ runner.temp }}/performance/contracts/*/outcomes.json
          if-no-files-found: error
