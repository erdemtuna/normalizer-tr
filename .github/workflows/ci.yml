name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Rust and installed Python binding (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Select build interpreter
        run: '"PYO3_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV'
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Strict workspace Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test default core
        run: cargo test --locked
      - name: Test no-default core
        run: cargo test --locked --no-default-features
      - name: Test Serde core
        run: cargo test --locked --all-features
      - name: Build API documentation
        run: cargo doc --locked --no-deps --all-features
      - name: Install Python development tools
        run: python -m pip install -r .\bindings\python\requirements-dev.txt -c .\bindings\python\constraints.lock
      - name: Check Python formatting and lint
        run: |
          python -m ruff check bindings\python benches scripts &&
          python -m ruff format --check bindings\python benches scripts
      - name: Check Python types
        run: python -m mypy bindings\python\python --check-untyped-defs
      - name: Test verification helpers
        run: python -m unittest discover -s scripts\tests -t . && python -m scripts.ci_checks pins
      - name: Build native wheel
        run: python -m maturin build --release --locked --manifest-path .\bindings\python\Cargo.toml --interpreter python --out .\target\ci-wheels
      - name: Install built wheel
        run: |
          $wheels = @(Get-ChildItem -LiteralPath .\target\ci-wheels -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one built wheel.' }
          python -m pip install --no-deps $wheels[0].FullName
      - name: Test installed Python API without speech models
        run: python -m pytest .\bindings\python\tests -q
      - name: Check standalone core packaging
        run: cargo package -p normalizer-tr --locked

  msrv:
    name: Declared minimum Rust 1.94
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.94.0"
      - run: cargo +1.94.0 test --locked --all-features

  portable-binding:
    name: Installed binding (${{ matrix.os }}, CPython ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: macos-14
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate the binding toolchain from the runner image
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/normalizer-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Install build and test tools
        run: python -m pip install maturin==1.15.0 pytest==9.0.3
      - name: Build and install reviewed native binding
        run: |
          python -m maturin build --release --locked --manifest-path bindings/python/Cargo.toml --interpreter python --out target/ci-wheels
          python -m pip install --no-deps target/ci-wheels/*.whl
      - name: Test installed public API
        run: python -m pytest bindings/python/tests -q

  contracts:
    name: Public compatibility and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Lint workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
      - name: Download pinned semver checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/semver"
          gh release download v0.51.0 --repo obi1kenobi/cargo-semver-checks --pattern cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP/semver"
          tar -xzf "$RUNNER_TEMP/semver/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/semver"
      - name: Check default and Serde public APIs against PR base
        run: |
          "$RUNNER_TEMP/semver/cargo-semver-checks" --manifest-path Cargo.toml --baseline-root ../base --package normalizer-tr --default-features --release-type patch
          "$RUNNER_TEMP/semver/cargo-semver-checks" --manifest-path Cargo.toml --baseline-root ../base --package normalizer-tr --all-features --release-type patch
      - name: Compare public policy outcomes
        run: python -m scripts.compare_contracts --base ../base --output "$RUNNER_TEMP/contracts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-contract-comparison
          path: |
            ${{ runner.temp }}/contracts/*.json
            ${{ runner.temp }}/contracts/*.md
            ${{ runner.temp }}/contracts/*/outcomes.json
          if-no-files-found: error

  dependency-scope:
    name: Select dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      audit: ${{ steps.scope.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m scripts.ci_checks dependencies --base "$BASE_SHA"

  advisories:
    needs: dependency-scope
    uses: ./.github/workflows/advisories.yml
    with:
      scan: ${{ needs.dependency-scope.outputs.audit == 'true' }}

  gate:
    name: CI gate
    if: always()
    needs: [windows, msrv, portable-binding, contracts, dependency-scope, advisories]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require all checks to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python -m scripts.ci_checks gate
